name: B8 report

# Builds the three B8 documents on GitHub's runner and commits the PDFs back to
# the branch, so nobody needs TeX installed:
#   b8-cold-drink/B8-salted-ice-bath.pdf   the report (XeLaTeX)
#   b8-cold-drink/B8-model-derivation.pdf  the model derivation (pdfLaTeX)
#   b8-cold-drink/sypt_salt_ice_model.pdf  the salt-ice-water model notes (pdfLaTeX)
# It runs by itself when a push to main changes their sources; for another
# branch, or to rebuild by hand: Actions -> B8 report -> Run workflow.  The
# check workflow (b8-check.yml) stays free of LaTeX.

on:
  push:
    branches: [main]
    paths: ['b8-cold-drink/B8-salted-ice-bath.tex', 'b8-cold-drink/B8-model-derivation.tex', 'b8-cold-drink/sypt_salt_ice_model.tex', 'b8-cold-drink/figs/**', '.github/workflows/b8-report.yml']
  workflow_dispatch:

permissions:
  contents: write          # to commit the PDF
  actions: write           # to start the Pages workflow again afterwards

concurrency:
  group: b8-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: b8-cold-drink
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # the whole history, to date each PDF by its sources

      - name: Install TeX
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            texlive-xetex texlive-latex-recommended texlive-latex-extra texlive-pictures \
            texlive-fonts-recommended fonts-lmodern lmodern
          # the report's maths font is the only one not in fonts/
          kpsewhich latinmodern-math.otf || fc-list | grep -i 'latin modern math'

      # Each PDF is dated by the last commit that changed its sources, so the
      # same sources give the same file and the rebuild on main changes nothing.
      - name: Build the report (until the cross-references and contents settle)
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- B8-salted-ice-bath.tex figs fonts)" FORCE_SOURCE_DATE=1
          for pass in 1 2 3; do
            xelatex -interaction=nonstopmode -halt-on-error B8-salted-ice-bath.tex > /dev/null \
              || { grep -A8 '^!' B8-salted-ice-bath.log; exit 1; }   # show the TeX error
          done
          grep -E "Output written|Overfull|Rerun" B8-salted-ice-bath.log
          if grep -E "undefined references|Reference .* undefined|Citation .* undefined" B8-salted-ice-bath.log; then
            echo "::error::the report has undefined references"; exit 1
          fi

      - name: Build the model derivation (until the contents settle)
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- B8-model-derivation.tex)" FORCE_SOURCE_DATE=1
          for pass in 1 2 3; do
            pdflatex -interaction=nonstopmode -halt-on-error B8-model-derivation.tex > /dev/null \
              || { grep -A8 '^!' B8-model-derivation.log; exit 1; }   # show the TeX error
          done
          grep -E "Output written|Overfull|Rerun" B8-model-derivation.log

      - name: Build the salt-ice-water model notes (until the references settle)
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct -- sypt_salt_ice_model.tex)" FORCE_SOURCE_DATE=1
          for pass in 1 2 3; do
            pdflatex -interaction=nonstopmode -halt-on-error sypt_salt_ice_model.tex > /dev/null \
              || { grep -A8 '^!' sypt_salt_ice_model.log; exit 1; }   # show the TeX error
          done
          grep -E "Output written|Overfull|Rerun" sypt_salt_ice_model.log
          if grep -E "undefined references|Reference .* undefined" sypt_salt_ice_model.log; then
            echo "::error::the salt-ice-water notes have undefined references"; exit 1
          fi

      - name: Keep the PDFs and the logs with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b8-report
          path: |
            b8-cold-drink/B8-salted-ice-bath.pdf
            b8-cold-drink/B8-salted-ice-bath.log
            b8-cold-drink/B8-model-derivation.pdf
            b8-cold-drink/B8-model-derivation.log
            b8-cold-drink/sypt_salt_ice_model.pdf
            b8-cold-drink/sypt_salt_ice_model.log

      - name: Commit the PDFs if they changed
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add B8-salted-ice-bath.pdf B8-model-derivation.pdf sypt_salt_ice_model.pdf
          if git diff --cached --quiet; then
            echo "The PDFs are unchanged."
            exit 0
          fi
          git commit -q -m "Rebuild the B8 PDFs from ${GITHUB_SHA::7}"
          git pull -q --rebase origin "$GITHUB_REF_NAME"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # a push made with the workflow's own token starts no other workflow, so
      # ask for the Pages copy to be refreshed with the new PDF
      - name: Publish the new PDF on the site
        if: steps.commit.outputs.pushed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run b8-pages.yml --ref main
