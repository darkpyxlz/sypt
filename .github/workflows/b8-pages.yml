name: B8 web simulator

# Keeps the gh-pages branch an exact copy of main (minus .github), after the
# model's checks pass.  GitHub Pages can serve either branch: Settings -> Pages
# -> Deploy from a branch -> main or gh-pages, / (root).  Both have index.html
# at the top, which opens the simulator in b8-cold-drink/web/.  Choosing
# gh-pages means only a version that passed the checks goes live.

on:
  push:
    branches: [main]
    paths: ['b8-cold-drink/**', 'index.html', '.nojekyll', '.github/workflows/b8-pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b8-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check the model before publishing (pure Python, no packages)
        working-directory: b8-cold-drink
        run: python3 test_b8.py
      - name: Assemble the site (the repository as it is on main)
        run: |
          mkdir _site
          git archive --format=tar HEAD | tar -x -C _site
          rm -rf _site/.github
      - name: Push to the gh-pages branch
        working-directory: _site
        run: |
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Publish the B8 simulator from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
